  <div class="page">

    <footer>
      Registre de sources : Master Watchlist SSP (172 organisations, priorités P1/P2 — Maroc public, IFI, UE, ONU, coopération bilatérale, organisations régionales, climat/environnement, implementers privés). Périmètre élargi le 2026-08-10 : secteur privé, commerce/AfCFTA, gouvernance/PPP, digital, compétitivité, en plus de l'économie circulaire/verte/bleue et durabilité. Base source : Google Drive — dossier « South South Partners / Veille Appels d'Offre ». Les décisions « Retenir » / « Écarter », le suivi de soumission et les cases à cocher (éligibilité SSP, identification des experts, préparation des documents) ci-dessus sont propres à cette page et enregistrés dans l'artefact. Recherche élargie de vérification des échéances effectuée le 2026-09-08 (agrégateurs, Wayback Machine, proxy) — voir note par appel d'offre pour le détail ; le portail AfDB bloque tout accès automatisé, une vérification manuelle reste nécessaire pour les EOI AfDB.
      <p style="margin-top:10px;">Miroir statique publié sur GitHub Pages — ce miroir est en lecture seule (il ne peut pas enregistrer directement). Cliquer sur « Retenir », « Écarter » ou une case à cocher ouvre automatiquement le dashboard interactif sur claude.ai, où l'action peut être confirmée et enregistrée.</p>

</template><div id="mount"></div><script>(function main(TENDERS, LAST_UPDATED) {
  var artifactCapPromise;
  try { artifactCapPromise = claude.use("artifact"); }
  catch (e) { artifactCapPromise = Promise.resolve(null); }

  document.getElementById("mount").appendChild(
    document.getElementById("pageShell").content.cloneNode(true)
  );

  const SERVICE_LINES = {
    strategy_planning: "Stratégie & planification",
    policy_regulatory: "Politiques & réglementation",
    capacity_building: "Renforcement de capacités",
    project_management: "Gestion de projet / PIU",
    research_studies: "Études & recherche",
    innovation_technology: "Innovation & technologie"
  };
  const SECTORS = {
    circular_economy: "Économie circulaire",
    green_economy: "Économie verte",
    blue_economy: "Économie bleue",
    sustainability: "Durabilité",
    private_sector_development: "Secteur privé",
    trade_integration: "Commerce / AfCFTA",
    governance_ppp: "Gouvernance / PPP",
    digital_transformation: "Digital"
  };
  const CHECK_ITEMS = [
    ["eligibility", "Éligibilité SSP"],
    ["experts", "Identification des experts"],
    ["documents", "Préparation des documents"]
  ];

  const state = { sector: "all", service: "all", status: "all", search: "", sort: "deadline", confirmingId: null };
  let toastTimer = null;

  function showToast(msg, isError) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.toggle("is-error", !!isError);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
  }

  function daysUntil(iso) {
    if (!iso) return null;
    const ms = new Date(iso).getTime() - Date.now();
    return Math.ceil(ms / 86400000);
  }

  function urgencyClass(t) {
    const d = daysUntil(t.deadline);
    if (d === null) return "urgency-unknown";
    if (d < 0) return "urgency-unknown";
    if (d <= 14) return "urgency-soon";
    if (d <= 30) return "urgency-month";
    return "urgency-open";
  }

  function deadlineLabel(t) {
    const d = daysUntil(t.deadline);
    if (d === null) return "Échéance à vérifier";
    if (d < 0) return "Échéance dépassée";
    if (d === 0) return "Échéance aujourd'hui";
    if (d === 1) return "Échéance demain";
    return `Échéance dans ${d} j`;
  }

  function fmtDate(iso) {
    if (!iso) return null;
    return new Date(iso).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
  }

  function checklistDone(t) {
    const c = t.checklist || {};
    return CHECK_ITEMS.filter(([key]) => c[key]).length;
  }

  function buildChips(container, dict, key) {
    const all = document.createElement("button");
    all.className = "chip";
    all.textContent = "Tous";
    all.setAttribute("aria-pressed", state[key] === "all" ? "true" : "false");
    all.onclick = () => { state[key] = "all"; render(); };
    container.appendChild(all);
    Object.entries(dict).forEach(([id, label]) => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = label;
      chip.setAttribute("aria-pressed", state[key] === id ? "true" : "false");
      chip.onclick = () => { state[key] = id; render(); };
      container.appendChild(chip);
    });
  }

  function buildStatusChips(container) {
    const options = [["all", "Tous"], ["pending", "À traiter"], ["accepted", "Retenus"], ["submitted", "Soumis"]];
    options.forEach(([id, label]) => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = label;
      chip.dataset.statusId = id;
      chip.setAttribute("aria-pressed", state.status === id ? "true" : "false");
      chip.onclick = () => { state.status = id; render(); };
      container.appendChild(chip);
    });
  }

  function renderStats() {
    const open = TENDERS.filter(t => { const d = daysUntil(t.deadline); return d === null || d >= 0; });
    const soon = TENDERS.filter(t => { const d = daysUntil(t.deadline); return d !== null && d >= 0 && d <= 14; });
    const sources = new Set(TENDERS.map(t => t.org_source)).size;
    const retained = TENDERS.filter(t => t.decision === "accepted").length;
    const submitted = TENDERS.filter(t => t.submitted).length;
    const stats = [
      { num: open.length, label: "Opportunités suivies" },
      { num: soon.length, label: "Échéance < 14 j" },
      { num: retained, label: "Retenus" },
      { num: submitted, label: "Soumis" },
      { num: sources, label: "Bailleurs / sources" },
      { num: TENDERS.filter(t => t.date_added === LAST_UPDATED).length, label: "Nouveaux cette semaine" }
    ];
    const el = document.getElementById("stats");
    el.innerHTML = "";
    stats.forEach(s => {
      const card = document.createElement("div");
      card.className = "stat";
      card.innerHTML = `<div class="num">${s.num}</div><div class="label">${s.label}</div>`;
      el.appendChild(card);
    });
  }

  function buildFullHtml(tendersArr, lastUpdated) {
    const styleText = document.getElementById("pageStyle").textContent;
    const shellHtml = document.getElementById("pageShell").outerHTML;
    const json = JSON.stringify(tendersArr).replace(/</g, "\\u003c");
    const fnSrc = main.toString().replace(/<\/script/gi, "<\\/script");
    const openTag = "<" + "script>";
    const closeTag = "<" + "/script>";
    const inline = openTag + "(" + fnSrc + ")(" + json + "," + JSON.stringify(lastUpdated) + ");" + closeTag;
    return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veille Appels d'Offre — SSP</title><style id="pageStyle">${styleText}</style></head><body>${shellHtml}<div id="mount"></div>${inline}</body></html>`;
  }

  async function persist(newTenders, pendingLabel) {
    const listEl = document.getElementById("list");
    listEl.classList.add("is-saving");
    if (pendingLabel) showToast(pendingLabel);
    const cap = await artifactCapPromise;
    if (!cap) {
      listEl.classList.remove("is-saving");
      showToast("Ouverture du dashboard interactif sur claude.ai pour enregistrer votre choix…", true);
      window.open("https://claude.ai/code/artifact/33262d47-1ce1-4839-b997-9615069a48a1", "_blank", "noopener");
      return;
    }
    try {
      await cap.publish(buildFullHtml(newTenders, LAST_UPDATED));
      // Publish succeeded: this view (and every other open view) reloads
      // automatically to the new version, so no local re-render is needed.
    } catch (err) {
      listEl.classList.remove("is-saving");
      const code = err && err.code;
      if (code === "conflict") return; // a reload to the winning version is already underway
      if (code === "not_writer" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") {
        showToast("Vous êtes en lecture seule sur cette page : impossible d'enregistrer votre choix.", true);
      } else {
        showToast("Échec de l'enregistrement (" + (code || "erreur inconnue") + "). Réessayez.", true);
      }
    }
  }

  function onAccept(id) {
    const copy = TENDERS.map(t => t.id === id ? Object.assign({}, t, { decision: "accepted" }) : t);
    persist(copy, "Enregistrement…");
  }

  function onRevert(id) {
    const copy = TENDERS.map(t => t.id === id ? Object.assign({}, t, { decision: null }) : t);
    persist(copy, "Enregistrement…");
  }

  function onRejectClick(id) {
    state.confirmingId = id;
    render();
  }

  function onCancelReject() {
    state.confirmingId = null;
    render();
  }

  function onConfirmReject(id) {
    state.confirmingId = null;
    const copy = TENDERS.filter(x => x.id !== id);
    persist(copy, "Suppression…");
  }

  function onToggleCheck(id, key) {
    const copy = TENDERS.map(t => {
      if (t.id !== id) return t;
      const c = Object.assign({}, t.checklist || {});
      c[key] = !c[key];
      return Object.assign({}, t, { checklist: c });
    });
    persist(copy, "Enregistrement…");
  }

  function onToggleSubmitted(id) {
    const copy = TENDERS.map(t => t.id === id ? Object.assign({}, t, { submitted: !t.submitted }) : t);
    persist(copy, "Enregistrement…");
  }

  function render() {
    document.querySelectorAll("#sectorChips .chip").forEach((c, i) => {
      const id = i === 0 ? "all" : Object.keys(SECTORS)[i - 1];
      c.setAttribute("aria-pressed", state.sector === id ? "true" : "false");

    document.querySelectorAll("#serviceChips .chip").forEach((c, i) => {

    document.querySelectorAll("#statusChips .chip").forEach(c => {
      c.setAttribute("aria-pressed", state.status === c.dataset.statusId ? "true" : "false");
    });

    let items = TENDERS.filter(t => {
      if (state.sector !== "all" && !t.sector_tags.includes(state.sector)) return false;
      if (state.service !== "all" && !t.service_line_tags.includes(state.service)) return false;
      if (state.status === "pending" && t.decision === "accepted") return false;
      if (state.status === "accepted" && t.decision !== "accepted") return false;
      if (state.status === "submitted" && !t.submitted) return false;
      if (state.search) {
        const q = state.search.toLowerCase();
        const hay = `${t.title} ${t.country_region} ${t.org_source}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    items.sort((a, b) => {
      if (state.sort === "title") return a.title.localeCompare(b.title);
      if (state.sort === "added") return b.date_added.localeCompare(a.date_added);
      const da = a.deadline ? new Date(a.deadline).getTime() : Infinity;
      const db = b.deadline ? new Date(b.deadline).getTime() : Infinity;
      return da - db;
    });

    const list = document.getElementById("list");
    list.innerHTML = "";
    document.getElementById("emptyState").style.display = items.length ? "none" : "block";

    items.forEach(t => {
      const uc = urgencyClass(t);
      const isAccepted = t.decision === "accepted";
      const isConfirming = state.confirmingId === t.id;
      const card = document.createElement("article");
      card.className = `card ${uc}${isAccepted ? " is-accepted" : ""}`;
      const tagsHtml = [
        ...t.sector_tags.map(s => `<span class="tag sector-${s}">${SECTORS[s] || s}</span>`),
        ...t.service_line_tags.map(s => `<span class="tag">${SERVICE_LINES[s] || s}</span>`)
      ].join("");
      const dl = fmtDate(t.deadline);
      const isPartnership = t.category === "partnership_opportunity";
      const badgeHtml = isPartnership
        ? `<span class="partnership-badge">Partenariat</span>`
        : `<span class="deadline-pill">${deadlineLabel(t)}</span>`;
      let actionsHtml;
      if (isConfirming) {
        actionsHtml = `<div class="card-actions confirm-row"><span class="confirm-text">Écarter définitivement de la liste ?</span><button type="button" class="btn-decide btn-reject" data-action="confirm-reject" data-id="${t.id}">Oui, écarter</button><button type="button" class="action-link" data-action="cancel-reject" data-id="${t.id}">Annuler</button></div>`;
      } else if (isAccepted) {
        const c = t.checklist || {};
        const done = checklistDone(t);
        const submitted = !!t.submitted;
        const progClass = submitted ? "is-submitted" : (done === 3 ? "is-ready" : "");
        const progLabel = submitted ? "✓ Soumissionné" : (done === 3 ? "Prêt à soumettre" : `En préparation (${done}/3)`);
        const checksHtml = CHECK_ITEMS.map(([key, label]) => `<label class="check-item${c[key] ? " is-checked" : ""}"><input type="checkbox" data-check="${key}" data-id="${t.id}" ${c[key] ? "checked" : ""}> ${label}</label>`).join("");
        actionsHtml = `
          <div class="card-actions">
            <span class="progress-badge ${progClass}">${progLabel}</span>
            <button type="button" class="btn-decide ${submitted ? "btn-submitted" : "btn-submit"}" data-action="toggle-submitted" data-id="${t.id}">${submitted ? "✓ Soumissionné" : "Marquer comme soumissionné"}</button>
            <button type="button" class="action-link" data-action="revert" data-id="${t.id}">retirer des retenus</button>
          </div>
          <div class="checklist-row">${checksHtml}</div>`;
      } else {
        actionsHtml = `<div class="card-actions"><button type="button" class="btn-decide btn-accept" data-action="accept" data-id="${t.id}">✓ Retenir</button><button type="button" class="btn-decide btn-reject" data-action="reject" data-id="${t.id}">✕ Écarter</button></div>`;
      }
      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="card-title"><a href="${t.url}" target="_blank" rel="noopener">${t.title}</a></div>
            <div class="card-source">${t.org_source} · ${t.country_region}</div>
          </div>
          ${badgeHtml}
        </div>
        <div class="card-meta">${dl ? `Date limite : ${dl}. ` : ""}${t.deadline_note || ""}</div>
        <div class="card-tags">${tagsHtml}</div>
        ${actionsHtml}
      `;
      list.appendChild(card);
    });
  }

  document.getElementById("list").addEventListener("click", e => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === "accept") onAccept(id);
    else if (btn.dataset.action === "reject") onRejectClick(id);
    else if (btn.dataset.action === "confirm-reject") onConfirmReject(id);
    else if (btn.dataset.action === "cancel-reject") onCancelReject();
    else if (btn.dataset.action === "revert") onRevert(id);
    else if (btn.dataset.action === "toggle-submitted") onToggleSubmitted(id);
  });

  document.getElementById("list").addEventListener("change", e => {
    const box = e.target.closest("input[type=checkbox][data-check]");
    if (!box) return;
    onToggleCheck(box.dataset.id, box.dataset.check);
  });

  buildStatusChips(document.getElementById("statusChips"));
  buildChips(document.getElementById("sectorChips"), SECTORS, "sector");
  buildChips(document.getElementById("serviceChips"), SERVICE_LINES, "service");

  renderStats();
  render();
